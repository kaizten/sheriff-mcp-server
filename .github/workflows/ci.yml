# Two jobs, because they need different things and fail for different reasons.
#
# build: both modules and every unit suite, on Linux, macOS and Windows. None
# of them needs Docker, so a red here is always the code, and a red on one
# system only is that system's paths, shells or executables.
#
# e2e: scripts/e2e.sh against the real kaizten/sheriff image and real git,
# with a stand-in for the model, so it costs no tokens. It is the only check
# of what the unit suites cannot see: which branch the loop edits, whether the
# MCP's stdout stays clean, whether a timed-out container is really gone. A
# red here with a green build can also be a new image: compare against the
# last green run before touching the code.
#
# Nothing is uploaded. The e2e job extracts the rule catalog from the image,
# which is Kaizten's content, and it stays on the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test both modules
        run: mvn -B install
        shell: bash
      # --no-pull: the Linux runner has Docker, and the image is 4 GB.
      - name: Install as a user would (Linux, macOS)
        if: runner.os != 'Windows'
        run: SHERIFF_HOME="$RUNNER_TEMP/sheriff" scripts/install.sh --no-mcp --no-pull
        shell: bash
      # Windows PowerShell, the one Windows ships with: it treats a native
      # command's stderr differently from PowerShell 7, which the release
      # workflow runs the installer under.
      - name: Install as a user would (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:SHERIFF_HOME = Join-Path $env:RUNNER_TEMP 'sheriff'
          ./scripts/install.ps1 -NoMcp -NoPull
        shell: powershell
      - name: The installed jar starts
        run: java -jar "$RUNNER_TEMP/sheriff/sheriff-mcp.jar" --tools | head -c 200
        shell: bash
      # No Docker for Linux containers on these runners: the real "Sheriff's
      # image cannot be had" case. The check must say so and exit 2, not hang.
      - name: With no Sheriff image, --check fails clearly
        if: runner.os != 'Linux'
        run: |
          set +e
          java -jar "$RUNNER_TEMP/sheriff/sheriff-mcp.jar" --check --component sheriff-mcp-java 2> err.txt
          code=$?
          cat err.txt
          test "$code" -eq 2 && grep -q "could not be downloaded" err.txt
        shell: bash
      # The installers set up only the assistants a machine has, and say which
      # at the end; the steps above give them --no-mcp, which returns before
      # any of that. So each runs here as a user's would: with no assistant,
      # when it must write into no one's configuration, then with stand-ins
      # for claude, codex and agy that only record how they were called. The
      # runner is thrown away after, so its own home serves as the user's. mvn
      # is a stand-in too, as the jar was built above, and the script runs
      # under /bin/bash, which on macOS is the 3.2 a piped install gets there,
      # and on Windows Git Bash's, the shell Claude Code runs hooks in. Every
      # assistant must be given Java by its absolute path, and the server
      # started once with it.
      - name: The installer sets up the assistants there are, and only those (bash)
        shell: bash
        run: |
          set -euo pipefail
          temp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then temp="$(cygpath -u "$RUNNER_TEMP")"; fi
          tools="$temp/stand-ins"; build="$temp/stand-in-mvn"; calls="$temp/calls"
          none="$temp/none.log"; all="$temp/all.log"
          mkdir -p "$tools" "$build"
          printf '#!/bin/sh\nexit 0\n' > "$build/mvn"
          for tool in claude codex agy; do
            printf '#!/bin/sh\necho "%s $*" >> "%s"\n' "$tool" "$calls" > "$tools/$tool"
          done
          chmod +x "$build/mvn" "$tools"/*
          export SHERIFF_HOME="$temp/sheriff-assistants"
          PATH="$build:$PATH" /bin/bash scripts/install.sh --no-pull > "$none" 2>&1 || { cat "$none"; exit 1; }
          cat "$none"
          grep -q "No assistant was found" "$none"
          test ! -e "$HOME/.claude" && test ! -e "$HOME/.codex" && test ! -e "$HOME/.gemini"
          PATH="$tools:$build:$PATH" /bin/bash scripts/install.sh --no-pull > "$all" 2>&1 || { cat "$all"; exit 1; }
          cat "$all"
          grep -q "Sheriff is set up for Claude Code, Codex and Antigravity." "$all"
          grep -q -- "--hook-stop" "$HOME/.claude/settings.json"
          grep -q "mcp_servers.sheriff" "$HOME/.codex/config.toml"
          grep -q "sheriff-mcp.jar" "$HOME/.gemini/config/mcp_config.json"
          grep -q "claude mcp add --scope user sheriff -- /" "$calls" || grep -q "claude mcp add --scope user sheriff -- [A-Z]:/" "$calls"
          grep -q "The MCP server starts: OK" "$all"
          if grep -q '"command" : "java ' "$HOME/.claude/settings.json"; then echo "the hooks run java from the PATH"; exit 1; fi
          # The Windows steps below start from a machine with no assistant.
          rm -rf "$HOME/.claude" "$HOME/.codex" "$HOME/.gemini"
      # The same in Windows PowerShell, run through cmd so that the
      # installer's stderr reaches the log as text rather than as errors.
      - name: The installer sets up the assistants there are, and only those (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $tools = Join-Path $env:RUNNER_TEMP 'stand-ins'
          $build = Join-Path $env:RUNNER_TEMP 'stand-in-mvn'
          $calls = Join-Path $env:RUNNER_TEMP 'calls.txt'
          $none = Join-Path $env:RUNNER_TEMP 'none.log'
          $all = Join-Path $env:RUNNER_TEMP 'all.log'
          New-Item -ItemType Directory -Force -Path $tools, $build | Out-Null
          Set-Content -Encoding ASCII -Path (Join-Path $build 'mvn.cmd') -Value '@exit /b 0'
          foreach ($tool in 'claude', 'codex', 'agy') {
              Set-Content -Encoding ASCII -Path (Join-Path $tools "$tool.cmd") -Value "@echo $tool %*>>`"$calls`""
          }
          $env:SHERIFF_HOME = Join-Path $env:RUNNER_TEMP 'sheriff-assistants'
          $install = 'powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -NoPull'
          $env:PATH = "$build;$env:PATH"
          cmd /c "$install > `"$none`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content $none
          if ($code -ne 0) { throw "the installer failed with no assistant ($code)" }
          if (-not (Select-String -Quiet -Path $none -Pattern 'No assistant was found')) { throw 'no summary for no assistant' }
          foreach ($folder in '.claude', '.codex', '.gemini') {
              if (Test-Path (Join-Path $HOME $folder)) { throw "$folder was written with no assistant" }
          }
          $env:PATH = "$tools;$env:PATH"
          cmd /c "$install > `"$all`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content $all
          if ($code -ne 0) { throw "the installer failed with the stand-ins ($code)" }
          if (-not (Select-String -Quiet -SimpleMatch -Path $all -Pattern 'Sheriff is set up for Claude Code, Codex and Antigravity.')) { throw 'no summary for three assistants' }
          if (-not (Select-String -Quiet -SimpleMatch -Path (Join-Path $HOME '.claude\settings.json') -Pattern '--hook-stop')) { throw 'no hooks for Claude Code' }
          if (-not (Select-String -Quiet -SimpleMatch -Path (Join-Path $HOME '.codex\config.toml') -Pattern 'mcp_servers.sheriff')) { throw 'no server for Codex' }
          if (-not (Test-Path (Join-Path $HOME '.gemini\config\mcp_config.json'))) { throw 'no server for Antigravity' }
          if (-not (Select-String -Quiet -SimpleMatch -Path $calls -Pattern 'claude mcp add --scope user sheriff')) { throw 'the server was not registered' }
          if (-not (Select-String -Quiet -SimpleMatch -Path $calls -Pattern 'java.exe -jar')) { throw 'the server was registered without the path of java.exe' }
          if (Select-String -Quiet -SimpleMatch -Path (Join-Path $HOME '.claude\settings.json') -Pattern '"command" : "java ') { throw 'the hooks run java from the PATH' }
          if (-not (Select-String -Quiet -SimpleMatch -Path $all -Pattern 'The MCP server starts: OK')) { throw 'the server was not started once' }
          Write-Host 'The installer set up the assistants there were, and only those.'
      # The case of a Java installed with no PATH entry and no JAVA_HOME, as
      # Temurin's MSI can leave it: the installer must find it where JDKs are
      # installed and give the hooks and the server its absolute path. Every
      # folder with a java.exe leaves the PATH, and Program Files is a folder
      # whose Eclipse Adoptium holds this runner's JDK.
      - name: The installer finds a Java that is not on the PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $programs = Join-Path $env:RUNNER_TEMP 'programs'
          $log = Join-Path $env:RUNNER_TEMP 'hidden-java.log'
          New-Item -ItemType Directory -Force -Path (Join-Path $programs 'Eclipse Adoptium') | Out-Null
          New-Item -ItemType Junction -Path (Join-Path $programs 'Eclipse Adoptium\jdk-17-ci') -Target $env:JAVA_HOME | Out-Null
          $env:PATH = (Join-Path $env:RUNNER_TEMP 'stand-ins') + ';' + (Join-Path $env:RUNNER_TEMP 'stand-in-mvn') + ';' + (($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'java.exe')) }) -join ';')
          Remove-Item Env:JAVA_HOME
          $env:ProgramFiles = $programs
          $env:SHERIFF_HOME = Join-Path $env:RUNNER_TEMP 'sheriff-hidden-java'
          if (Get-Command java -ErrorAction SilentlyContinue) { throw 'java is still on the PATH' }
          cmd /c "powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -NoPull -NoCodex -NoAntigravity > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content $log
          if ($code -ne 0) { throw "the installer failed with Java off the PATH ($code)" }
          if (-not (Select-String -Quiet -SimpleMatch -Path (Join-Path $HOME '.claude\settings.json') -Pattern 'Eclipse Adoptium/jdk-17-ci/bin/java.exe')) { throw 'the hooks do not run the Java found' }
          if (-not (Select-String -Quiet -SimpleMatch -Path $log -Pattern 'The MCP server starts: OK')) { throw 'the server was not started once' }
          Write-Host 'The installer found the Java that was not on the PATH.'

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pull Sheriff
        run: docker pull kaizten/sheriff:latest
      - name: End-to-end checks
        run: scripts/e2e.sh
