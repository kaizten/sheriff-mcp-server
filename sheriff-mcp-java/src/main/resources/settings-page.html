<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sheriff settings</title>
<style>
:root {
  --bg: #ffffff; --subtle: #f6f8fa; --text: #1f2328; --muted: #59636e; --faint: #818b98;
  --line: #d1d9e0; --line-soft: #e8ecf0; --accent: #0969da; --accent-text: #ffffff;
  --accent-soft: #ddf4ff; --warn: #9a6700; --warn-soft: #fff8c5; --bad: #d1242f; --ok: #1a7f37;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --subtle: #151b23; --text: #e6edf3; --muted: #9198a1; --faint: #6e7681;
    --line: #3d444d; --line-soft: #262c34; --accent: #4493f8; --accent-text: #0d1117;
    --accent-soft: #121d2f; --warn: #d29922; --warn-soft: #272115; --bad: #f85149; --ok: #3fb950;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
code, input, select { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
button { font: inherit; color: inherit; }
.page { max-width: 1040px; margin: 0 auto; padding: 0 24px 120px; }
header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 32px 0 20px; }
header > div:first-child { flex: 1 1 320px; min-width: 0; }
.actions { display: flex; flex: none; align-items: center; gap: 12px; }
.tabs button[aria-pressed="true"] { background: var(--bg); color: var(--text); font-weight: 600;
  box-shadow: 0 0 0 1px var(--line); }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
.where { margin: 2px 0 0; color: var(--muted); font-size: 13px; word-break: break-all; }
.button { height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--subtle);
  cursor: pointer; font-weight: 500; white-space: nowrap; }
.button:hover { border-color: var(--faint); }
.button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.button:disabled { opacity: .5; cursor: default; }
.scope { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 0 0 20px;
  border-bottom: 1px solid var(--line-soft); }
.tabs { display: inline-flex; padding: 3px; border-radius: 8px; background: var(--subtle); border: 1px solid var(--line-soft); }
.tabs button { border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--bg); color: var(--text); font-weight: 600;
  box-shadow: 0 0 0 1px var(--line); }
.scope p { margin: 0; color: var(--muted); font-size: 13px; }
.scope code { font-size: 12px; color: var(--text); }
.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 40px; padding-top: 24px; }
nav { position: sticky; top: 16px; align-self: start; }
nav input { width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--text); font-family: inherit; margin-bottom: 12px; }
nav a { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 6px;
  color: var(--muted); text-decoration: none; }
nav a:hover { background: var(--subtle); color: var(--text); }
nav a span { color: var(--accent); font-size: 12px; font-weight: 600; }
.order { margin: 16px 8px 0; color: var(--faint); font-size: 12px; }
.notice { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 10px 14px; margin-bottom: 24px; }
.notice strong { display: block; margin-bottom: 4px; }
.notice ul { margin: 0; padding-left: 18px; }
section { margin-bottom: 36px; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 6px 32px; padding: 14px 0;
  border-bottom: 1px solid var(--line-soft); }
.row:last-child { border-bottom: 0; }
.row[hidden], section[hidden] { display: none; }
.row label { font-weight: 600; }
.badge { margin-left: 6px; padding: 0 6px; border-radius: 10px; font-size: 11px; font-weight: 500;
  background: var(--accent-soft); color: var(--accent); vertical-align: 1px; }
.badge.pending { background: var(--warn-soft); color: var(--warn); }
.desc { margin: 2px 0 0; color: var(--muted); }
.meta { margin: 4px 0 0; color: var(--faint); font-size: 12px; }
.meta code { font-size: 12px; }
.note { margin: 4px 0 0; color: var(--warn); font-size: 12px; }
.note.quiet { color: var(--faint); }
.section-note { margin: 0 0 4px; color: var(--muted); font-size: 13px; }
.section-note[hidden] { display: none; }
.error { margin: 4px 0 0; color: var(--bad); font-size: 12px; }
.control { display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding-top: 2px; }
.field { position: relative; display: flex; align-items: center; }
.field input, .control select { width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13px; }
.field .unit { position: absolute; right: 10px; color: var(--faint); font-size: 12px; pointer-events: none; }
.field input.with-unit { padding-right: 64px; }
input:focus, select:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
input:disabled, select:disabled { background: var(--subtle); color: var(--faint); }
input.invalid { border-color: var(--bad); }
.segments { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.segments button { flex: 1 1 0; min-width: 0; height: 30px; padding: 0 8px; border: 0; border-left: 1px solid var(--line);
  background: var(--bg); cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.segments button:first-child { border-left: 0; }
.segments button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.segments button:disabled { cursor: default; color: var(--faint); }
.reset { align-self: flex-end; border: 0; background: none; padding: 0; color: var(--accent); font-size: 12px; cursor: pointer; }
.reset:hover { text-decoration: underline; }
.empty { color: var(--muted); padding: 24px 0; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); }
.savebar[hidden] { display: none; }
.savebar .inner { max-width: 1040px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
.savebar p { margin: 0 auto 0 0; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 13px; }
.toast[hidden] { display: none; }
.closed { padding: 120px 0; text-align: center; color: var(--muted); }
@media (max-width: 820px) {
  .page { padding: 0 16px 120px; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  nav { position: static; }
  nav .links, .order { display: none; }
  .row { grid-template-columns: minmax(0, 1fr); }
  .savebar .inner { padding: 12px 16px; }
}
</style>
</head>
<body>
<div class="page" id="page">
  <header>
    <div>
      <h1 data-text="title">Sheriff settings</h1>
      <p class="where" id="where"></p>
    </div>
    <div class="actions">
      <div class="tabs" role="group" data-label="language" aria-label="Language">
        <button type="button" id="lang-en" lang="en" aria-pressed="true">English</button>
        <button type="button" id="lang-es" lang="es" aria-pressed="false">Español</button>
      </div>
      <button type="button" class="button" id="close" data-text="close">Close</button>
    </div>
  </header>
  <div class="scope">
    <div class="tabs" role="tablist" data-label="scope" aria-label="Where a change is saved">
      <button type="button" role="tab" id="tab-user" aria-selected="true" data-text="yours">Your settings</button>
      <button type="button" role="tab" id="tab-project" aria-selected="false" data-text="project">This project</button>
    </div>
    <p id="scope-note"></p>
  </div>
  <div class="layout">
    <nav data-label="sections" aria-label="Sections">
      <input type="search" id="filter" data-placeholder="search" data-label="searchLabel" placeholder="Search"
        aria-label="Search settings" autocomplete="off">
      <div class="links" id="links"></div>
      <p class="order" data-text="order">An environment variable wins over this project's file, which wins over yours.</p>
    </nav>
    <main id="main"><p class="empty" data-text="loading">Loading…</p></main>
  </div>
</div>
<div class="savebar" id="savebar" hidden>
  <div class="inner">
    <p id="pending-count"></p>
    <button type="button" class="button" id="discard" data-text="discard">Discard</button>
    <button type="button" class="button primary" id="save" data-text="save">Save changes</button>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function () {
  "use strict";
  var WORDS = {
    en: {
      title: "Sheriff settings", close: "Close", language: "Language", yours: "Your settings", project: "This project",
      scope: "Where a change is saved", sections: "Sections", search: "Search", searchLabel: "Search settings",
      order: "An environment variable wins over this project's file, which wins over yours.", loading: "Loading…",
      discard: "Discard", save: "Save changes", other: "Other", defaultChoice: "Default", on: "On", off: "Off",
      theDefault: "the default", inEffect: "In effect: ", byDefault: " (default)", from: ", from ",
      fromDefault: "default", fromEnvironment: "environment variable", fromProject: "this project",
      fromYours: "your settings", seconds: "seconds", setHere: "Set here", unsaved: "Unsaved",
      reset: "Reset to default", environmentNote: "The environment variable is set, so it wins over both files while it is.",
      onlyYours: "Only in your settings.", projectImage: "This project may only set {0}, a tag or a digest of it.",
      userScope: "For every project you open. Saved in ", projectScope: "For everyone who opens this project. Saved in ",
      nowhere: "nowhere: no HOME, XDG_CONFIG_HOME or APPDATA",
      sectionNote: "Some of these are only in your settings: a project that is cloned must not choose who fixes your "
        + "code, what it runs or where it sends it, for whoever opens it.",
      ignored: "Some settings in the files are ignored", noMatch: "No setting matches that search.",
      pendingOne: "1 unsaved change", pendingMany: "{0} unsaved changes",
      failedOne: "1 change was not saved: see the setting marked in red.",
      failedMany: "{0} changes were not saved: see the settings marked in red.",
      savedOne: "Saved. New sessions use it; the hooks, from their next run.",
      savedMany: "Saved {0} changes. New sessions use them; the hooks, from their next run.",
      discardOne: "Discard 1 unsaved change?", discardMany: "Discard {0} unsaved changes?",
      closed: "The settings page is closed. You can close this tab.", answered: "The page answered {0}."
    },
    es: {
      title: "Ajustes de Sheriff", close: "Cerrar", language: "Idioma", yours: "Tus ajustes", project: "Este proyecto",
      scope: "Dónde se guarda un cambio", sections: "Secciones", search: "Buscar", searchLabel: "Buscar ajustes",
      order: "Una variable de entorno gana al fichero de este proyecto, que gana al tuyo.", loading: "Cargando…",
      discard: "Descartar", save: "Guardar cambios", other: "Otros", defaultChoice: "Por defecto", on: "Sí", off: "No",
      theDefault: "el valor por defecto", inEffect: "En vigor: ", byDefault: " (por defecto)", from: ", de ",
      fromDefault: "por defecto", fromEnvironment: "la variable de entorno", fromProject: "este proyecto",
      fromYours: "tus ajustes", seconds: "segundos", setHere: "Cambiado aquí", unsaved: "Sin guardar",
      reset: "Volver al valor por defecto",
      environmentNote: "La variable de entorno está puesta, así que gana a los dos ficheros mientras lo esté.",
      onlyYours: "Solo en tus ajustes.", projectImage: "Este proyecto solo puede poner {0}, una etiqueta o un digest suyo.",
      userScope: "Para todos los proyectos que abras. Se guarda en ",
      projectScope: "Para todos los que abran este proyecto. Se guarda en ",
      nowhere: "ningún sitio: no hay HOME, XDG_CONFIG_HOME ni APPDATA",
      sectionNote: "Algunos de estos solo están en tus ajustes: un proyecto clonado no debe elegir, por quien lo "
        + "abra, quién arregla su código, qué ejecuta ni a dónde lo envía.",
      ignored: "Algunos ajustes de los ficheros se ignoran", noMatch: "Ningún ajuste coincide con esa búsqueda.",
      pendingOne: "1 cambio sin guardar", pendingMany: "{0} cambios sin guardar",
      failedOne: "1 cambio no se ha guardado: mira el ajuste marcado en rojo.",
      failedMany: "{0} cambios no se han guardado: mira los ajustes marcados en rojo.",
      savedOne: "Guardado. Las sesiones nuevas lo usan; los hooks, desde su próxima ejecución.",
      savedMany: "Guardados {0} cambios. Las sesiones nuevas los usan; los hooks, desde su próxima ejecución.",
      discardOne: "¿Descartar 1 cambio sin guardar?", discardMany: "¿Descartar {0} cambios sin guardar?",
      closed: "La página de ajustes está cerrada. Ya puedes cerrar esta pestaña.",
      answered: "La página respondió {0}.",
      refused: "No se admite «{0}»: {1}",
      takes: {
        seconds: "admite un número entero de segundos, 1 o más.",
        count: "admite un número entero, {0} o más.",
        share: "admite un porcentaje de 0 a 100, con o sin %.",
        flag: "admite 0 o 1.",
        choice: "admite {0}.",
        word: "admite un valor sin espacios ni barras invertidas.",
        mutators: "admite mutadores o grupos de PIT en mayúsculas, separados por comas.",
        command: "admite un comando en una línea, sin barras invertidas (escribe las rutas con /).",
        address: "admite una dirección que empiece por http:// o https://."
      }
    }
  };
  var LANGUAGES = ["en", "es"];
  var STORED_LANGUAGE = "sheriff-settings-language";
  var language = chosenLanguage();
  var data = null;
  var scope = "user";
  var pending = {};
  var errors = {};
  var rows = [];
  var toastTimer = null;
  var UNITS = { seconds: "seconds", share: "%" };

  function chosenLanguage() {
    try {
      var stored = window.localStorage.getItem(STORED_LANGUAGE);
      if (LANGUAGES.indexOf(stored) >= 0) { return stored; }
    } catch (error) {
      stored = null;
    }
    var wanted = (navigator.languages || [navigator.language || "en"]).map(function (tag) {
      return String(tag).slice(0, 2).toLowerCase();
    });
    for (var index = 0; index < wanted.length; index += 1) {
      if (LANGUAGES.indexOf(wanted[index]) >= 0) { return wanted[index]; }
    }
    return "en";
  }

  function say(name) {
    var text = WORDS[language][name];
    var values = Array.prototype.slice.call(arguments, 1);
    return text.replace(/\{(\d)\}/g, function (all, index) { return values[Number(index)]; });
  }

  function count(one, many, number) { return number === 1 ? say(one) : say(many, number); }

  function make(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined && text !== null) { node.textContent = text; }
    return node;
  }

  function call(method, path, body) {
    var options = { method: method, headers: {}, cache: "no-store" };
    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    return fetch(path, options).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (json) {
        if (!response.ok) { throw new Error(json.error || say("answered", response.status)); }
        return json;
      });
    });
  }

  function translated(item, field) {
    var words = item.translations && item.translations[language];
    if (typeof words === "string") { return words; }
    return words && words[field] ? words[field] : item[field];
  }
  function labelOf(setting) { return translated(setting, "label"); }
  function helpOf(setting) { return translated(setting, "help"); }
  function titleOf(section) {
    var title = section.translations && section.translations[language];
    return title || section.title || say("other");
  }

  function key(name) { return scope + ":" + name; }
  function inFile(setting) { return scope === "project" ? setting.inProject : setting.yours; }
  function allowed(setting) { return scope === "user" || setting.projectMay; }
  function shown(setting) {
    var change = pending[key(setting.name)];
    return change !== undefined ? change : inFile(setting);
  }
  function pendingCount() { return Object.keys(pending).length; }

  function toast(text) {
    var node = document.getElementById("toast");
    node.textContent = text;
    node.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { node.hidden = true; }, 5000);
  }

  function choiceLabel(setting, value) {
    if (setting.kind === "flag") { return value === "1" ? say("on") : say("off"); }
    return value;
  }

  function defaultLabel(setting) {
    if (!setting["default"]) { return say("defaultChoice"); }
    return say("defaultChoice") + " (" + choiceLabel(setting, setting["default"]).toLowerCase() + ")";
  }

  function readable(setting, value) {
    if (value === "worked out") { return say("theDefault"); }
    return setting.kind === "flag" ? choiceLabel(setting, value) : value;
  }

  function source(setting) {
    if (setting.source === "default") { return say("fromDefault"); }
    if (setting.source === "the environment") { return say("fromEnvironment"); }
    if (setting.source === data.projectFile) { return say("fromProject"); }
    if (setting.source === data.userFile) { return say("fromYours"); }
    return setting.source;
  }

  function refusal(setting, error) {
    var takes = WORDS[language].takes;
    if (!takes || error.message.indexOf(setting.name + " takes ") !== 0 || !takes[setting.kind]) {
      return error.message;
    }
    var detail = setting.kind === "count" ? String(setting.minimum) : setting.choices.join(", ");
    return say("refused", error.value, takes[setting.kind].replace("{0}", detail));
  }

  function change(setting, value) {
    var id = key(setting.name);
    if (value === inFile(setting)) { delete pending[id]; } else { pending[id] = value; }
    delete errors[id];
    refreshBar();
  }

  function segmented(setting, refresh) {
    var group = make("div", "segments");
    group.setAttribute("role", "group");
    group.setAttribute("aria-label", labelOf(setting));
    var buttons = ["", "1", "0"].map(function (value) {
      var button = make("button", null, value === "" ? say("defaultChoice") : choiceLabel(setting, value));
      button.type = "button";
      button.title = value === "" ? defaultLabel(setting) : button.textContent;
      button.addEventListener("click", function () { change(setting, value); refresh(); });
      group.appendChild(button);
      return { value: value, node: button };
    });
    return {
      node: group,
      update: function () {
        buttons.forEach(function (button) {
          button.node.setAttribute("aria-pressed", String(button.value === shown(setting)));
          button.node.disabled = !allowed(setting);
        });
      }
    };
  }

  function dropdown(setting, refresh) {
    var select = make("select");
    select.id = "setting-" + setting.name;
    var unset = make("option", null, defaultLabel(setting));
    unset.value = "";
    select.appendChild(unset);
    setting.choices.forEach(function (value) {
      var option = make("option", null, value);
      option.value = value;
      select.appendChild(option);
    });
    select.addEventListener("change", function () { change(setting, select.value); refresh(); });
    return {
      node: select,
      update: function () {
        select.value = shown(setting);
        if (select.value !== shown(setting)) { select.value = ""; }
        select.disabled = !allowed(setting);
      }
    };
  }

  function textField(setting, refresh) {
    var wrap = make("div", "field");
    var input = make("input");
    input.id = "setting-" + setting.name;
    var numeric = setting.kind === "seconds" || setting.kind === "count" || setting.kind === "share";
    input.type = numeric ? "number" : "text";
    if (numeric) {
      input.min = String(setting.kind === "seconds" ? 1 : setting.minimum);
      input.step = "1";
      if (setting.kind === "share") { input.max = "100"; }
      input.inputMode = "numeric";
    }
    input.spellcheck = false;
    input.autocomplete = "off";
    wrap.appendChild(input);
    if (UNITS[setting.kind]) {
      input.className = "with-unit";
      wrap.appendChild(make("span", "unit", UNITS[setting.kind] === "%" ? "%" : say(UNITS[setting.kind])));
    }
    input.addEventListener("input", function () { change(setting, input.value.trim()); refresh(false); });
    return {
      node: wrap,
      update: function (rewrite) {
        if (rewrite !== false) { input.value = shown(setting); }
        input.placeholder = setting.value === "worked out" ? say("defaultChoice") : setting.value;
        input.disabled = !allowed(setting);
        input.classList.toggle("invalid", Boolean(errors[key(setting.name)]));
      }
    };
  }

  function row(setting) {
    var node = make("div", "row");
    var text = make("div");
    var title = make("div");
    var label = make("label", null, labelOf(setting));
    label.htmlFor = "setting-" + setting.name;
    var badge = make("span", "badge");
    title.appendChild(label);
    title.appendChild(badge);
    text.appendChild(title);
    text.appendChild(make("p", "desc", helpOf(setting)));
    var meta = make("p", "meta");
    text.appendChild(meta);
    var note = make("p", "note");
    text.appendChild(note);
    var error = make("p", "error");
    error.setAttribute("role", "alert");
    text.appendChild(error);
    var control = make("div", "control");
    var editor;
    function refresh(rewrite) { update(rewrite); }
    if (setting.kind === "flag") {
      editor = segmented(setting, refresh);
    } else if (setting.kind === "choice") {
      editor = dropdown(setting, refresh);
    } else {
      editor = textField(setting, refresh);
    }
    control.appendChild(editor.node);
    var reset = make("button", "reset", say("reset"));
    reset.type = "button";
    reset.addEventListener("click", function () { change(setting, ""); update(); });
    control.appendChild(reset);
    node.appendChild(text);
    node.appendChild(control);

    function update(rewrite) {
      var id = key(setting.name);
      var isPending = pending[id] !== undefined;
      var set = inFile(setting) !== "";
      badge.hidden = !isPending && !set;
      badge.className = isPending ? "badge pending" : "badge";
      badge.textContent = isPending ? say("unsaved") : say("setHere");
      meta.textContent = "";
      meta.appendChild(make("code", null, setting.name));
      var effective = " · " + say("inEffect") + readable(setting, setting.value)
        + (setting.source === "default" ? (setting.value === "worked out" ? "" : say("byDefault"))
          : say("from") + source(setting));
      meta.appendChild(document.createTextNode(effective));
      note.className = "note";
      if (setting.environment) {
        note.textContent = say("environmentNote");
      } else if (!allowed(setting)) {
        note.className = "note quiet";
        note.textContent = say("onlyYours");
      } else if (scope === "project" && setting.projectImage) {
        note.textContent = say("projectImage", setting.projectImage);
      } else {
        note.textContent = "";
      }
      note.hidden = note.textContent === "";
      error.textContent = errors[id] ? refusal(setting, errors[id]) : "";
      error.hidden = !errors[id];
      reset.hidden = !allowed(setting) || shown(setting) === "";
      editor.update(rewrite);
    }

    return { node: node, setting: setting, update: update };
  }

  function refreshBar() {
    var number = pendingCount();
    document.getElementById("savebar").hidden = number === 0;
    document.getElementById("pending-count").textContent = count("pendingOne", "pendingMany", number);
  }

  function refreshScope() {
    document.getElementById("tab-user").setAttribute("aria-selected", String(scope === "user"));
    document.getElementById("tab-project").setAttribute("aria-selected", String(scope === "project"));
    var note = document.getElementById("scope-note");
    note.textContent = "";
    var file = scope === "user" ? data.userFile : data.projectFile;
    note.appendChild(document.createTextNode(scope === "user" ? say("userScope") : say("projectScope")));
    note.appendChild(make("code", null, file || say("nowhere")));
    rows.forEach(function (entry) { entry.update(); });
    document.querySelectorAll(".section-note").forEach(function (sectionNote) {
      sectionNote.hidden = scope !== "project" || sectionNote.dataset.userOnly !== "true";
    });
    refreshLinks();
    filter();
  }

  function refreshLinks() {
    document.querySelectorAll("nav a").forEach(function (link) {
      var section = data.sections[Number(link.dataset.index)];
      var set = section.settings.filter(function (setting) { return inFile(setting) !== ""; }).length;
      link.lastChild.textContent = set ? String(set) : "";
    });
  }

  function filter() {
    var words = document.getElementById("filter").value.trim().toLowerCase();
    var any = false;
    document.querySelectorAll("section").forEach(function (section) {
      var visible = 0;
      rows.filter(function (entry) { return entry.node.parentNode === section; }).forEach(function (entry) {
        var haystack = (labelOf(entry.setting) + " " + entry.setting.name + " " + helpOf(entry.setting)).toLowerCase();
        entry.node.hidden = words !== "" && haystack.indexOf(words) < 0;
        if (!entry.node.hidden) { visible += 1; }
      });
      section.hidden = visible === 0;
      if (visible) { any = true; }
    });
    var none = document.getElementById("no-match");
    if (none) { none.hidden = any; }
  }

  function translatePage() {
    document.documentElement.lang = language;
    document.title = say("title");
    document.querySelectorAll("[data-text]").forEach(function (node) { node.textContent = say(node.dataset.text); });
    document.querySelectorAll("[data-label]").forEach(function (node) {
      node.setAttribute("aria-label", say(node.dataset.label));
    });
    document.querySelectorAll("[data-placeholder]").forEach(function (node) {
      node.placeholder = say(node.dataset.placeholder);
    });
    LANGUAGES.forEach(function (each) {
      document.getElementById("lang-" + each).setAttribute("aria-pressed", String(each === language));
    });
  }

  function choose(chosen) {
    language = chosen;
    try {
      window.localStorage.setItem(STORED_LANGUAGE, chosen);
    } catch (error) {
      chosen = language;
    }
    translatePage();
    if (data) { render(); }
  }

  function render() {
    document.getElementById("where").textContent = data.projectFile.replace(/[\\/]\.sheriff\.properties$/, "");
    var main = document.getElementById("main");
    var links = document.getElementById("links");
    main.textContent = "";
    links.textContent = "";
    rows = [];
    if (data.problems.length) {
      var notice = make("div", "notice");
      notice.appendChild(make("strong", null, say("ignored")));
      var list = make("ul");
      data.problems.forEach(function (problem) {
        var item = make("li", null, problem);
        item.lang = "en";
        list.appendChild(item);
      });
      notice.appendChild(list);
      main.appendChild(notice);
    }
    data.sections.forEach(function (section, index) {
      var block = make("section");
      block.id = "section-" + index;
      block.appendChild(make("h2", null, titleOf(section)));
      var userOnly = section.settings.some(function (setting) { return !setting.projectMay; });
      var sectionNote = make("p", "section-note", say("sectionNote"));
      sectionNote.dataset.userOnly = String(userOnly);
      block.appendChild(sectionNote);
      section.settings.forEach(function (setting) {
        var entry = row(setting);
        rows.push(entry);
        block.appendChild(entry.node);
      });
      main.appendChild(block);
      var link = make("a", null, titleOf(section));
      link.href = "#section-" + index;
      link.dataset.index = String(index);
      link.appendChild(make("span"));
      links.appendChild(link);
    });
    var none = make("p", "empty", say("noMatch"));
    none.id = "no-match";
    none.hidden = true;
    main.appendChild(none);
    refreshScope();
    refreshBar();
  }

  function load() {
    return call("GET", "settings").then(function (listing) {
      data = listing;
      render();
    });
  }

  function save() {
    var ids = Object.keys(pending);
    if (!ids.length) { return; }
    var button = document.getElementById("save");
    button.disabled = true;
    var saved = 0;
    var failed = {};
    var chain = Promise.resolve();
    ids.forEach(function (id) {
      var parts = id.split(":");
      var value = pending[id];
      chain = chain.then(function () {
        return call("POST", "settings", { name: parts[1], value: value, project: parts[0] === "project" })
          .then(function () { saved += 1; }, function (error) {
            failed[id] = { value: value, message: error.message };
          });
      });
    });
    chain.then(function () {
      pending = {};
      errors = {};
      Object.keys(failed).forEach(function (id) { pending[id] = failed[id].value; errors[id] = failed[id]; });
      return load();
    }).then(function () {
      button.disabled = false;
      var failures = Object.keys(failed).length;
      if (failures) {
        toast(count("failedOne", "failedMany", failures));
        var first = document.getElementById("setting-" + Object.keys(failed)[0].split(":")[1]);
        if (first) { first.scrollIntoView({ block: "center" }); }
      } else {
        toast(count("savedOne", "savedMany", saved));
      }
    }).catch(function (error) {
      button.disabled = false;
      toast(error.message);
    });
  }

  function discard() {
    pending = {};
    errors = {};
    rows.forEach(function (entry) { entry.update(); });
    refreshBar();
  }

  function close() {
    var number = pendingCount();
    if (number && !window.confirm(count("discardOne", "discardMany", number))) {
      return;
    }
    call("POST", "close", {}).catch(function () { return {}; }).then(function () {
      document.getElementById("savebar").hidden = true;
      var page = document.getElementById("page");
      page.textContent = "";
      page.appendChild(make("p", "closed", say("closed")));
    });
  }

  LANGUAGES.forEach(function (each) {
    document.getElementById("lang-" + each).addEventListener("click", function () { choose(each); });
  });
  document.getElementById("tab-user").addEventListener("click", function () { scope = "user"; refreshScope(); });
  document.getElementById("tab-project").addEventListener("click", function () { scope = "project"; refreshScope(); });
  document.getElementById("filter").addEventListener("input", filter);
  document.getElementById("save").addEventListener("click", save);
  document.getElementById("discard").addEventListener("click", discard);
  document.getElementById("close").addEventListener("click", close);
  document.addEventListener("keydown", function (event) {
    if ((event.ctrlKey || event.metaKey) && event.key === "s") {
      event.preventDefault();
      save();
    }
  });
  window.addEventListener("beforeunload", function (event) {
    if (pendingCount()) { event.preventDefault(); event.returnValue = ""; }
  });

  translatePage();
  load().catch(function (error) {
    var main = document.getElementById("main");
    main.textContent = "";
    main.appendChild(make("p", "empty", error.message));
  });
})();
</script>
</body>
</html>
